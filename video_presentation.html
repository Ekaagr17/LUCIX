<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUCIX — Forensic Intelligence Video Showcase</title>

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap"/>

  <style>
    :root {
      --bg-void: #050608;
      --bg-deep: #081321;
      --bg-card: rgba(8, 19, 33, 0.55);
      --glass-border: rgba(0, 229, 255, 0.12);
      --glass-border-bright: rgba(0, 229, 255, 0.28);
      --cyan: #00E5FF;
      --cyan-dim: rgba(0, 229, 255, 0.6);
      --azure: #3A86FF;
      --azure-dim: rgba(58, 134, 255, 0.5);
      --teal: #00FFC6;
      --teal-dim: rgba(0, 255, 198, 0.45);
      --red: #FF5A5F;
      --red-dim: rgba(255, 90, 95, 0.4);
      --success: #DDFBFF;
      --text-1: #E8F4F8;
      --text-2: #8BA4B8;
      --text-3: #4A6478;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse 70% 50% at 20% 30%, rgba(0, 229, 255, 0.04) 0%, transparent 100%),
        radial-gradient(ellipse 60% 60% at 80% 70%, rgba(58, 134, 255, 0.03) 0%, transparent 100%),
        radial-gradient(ellipse 40% 30% at 50% 90%, rgba(0, 255, 198, 0.02) 0%, transparent 100%);
    }

    .video-theater {
      width: 100%;
      max-width: 1280px;
      background: rgba(5, 6, 8, 0.95);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 80px rgba(0, 229, 255, 0.06),
        0 40px 80px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(0, 229, 255, 0.08);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(40px);
    }

    .video-hud-header {
      background: rgba(8, 19, 33, 0.75);
      backdrop-filter: blur(24px);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 229, 255, 0.08);
      font-size: 12px;
    }
    .hud-title {
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-2);
      font-size: 11px;
    }
    .hud-title-icon {
      width: 8px; height: 8px;
      background: var(--cyan);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 12px var(--cyan);
    }
    .hud-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.08);
      color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }
    .hud-dot {
      width: 5px; height: 5px; border-radius: 50%; background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan); animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .hud-scene-name {
      color: var(--cyan);
      font-weight: 500;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      opacity: 0.8;
    }
    .hud-timecode {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--teal);
      background: rgba(0, 255, 198, 0.06);
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 198, 0.15);
      letter-spacing: 0.06em;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--bg-void);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }

    .subtitles-banner {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(5, 6, 8, 0.85);
      backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(0, 229, 255, 0.15);
      padding: 12px 28px;
      border-radius: 16px;
      max-width: 82%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.7),
        0 0 20px rgba(0, 229, 255, 0.04),
        inset 0 1px 0 rgba(0, 229, 255, 0.06);
    }
    .sub-speaker {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0.75;
    }
    .sub-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-1);
      font-weight: 400;
    }

    .video-controls-bar {
      background: rgba(8, 19, 33, 0.65);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 229, 255, 0.08);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-progress-container {
      width: 100%;
      height: 4px;
      background: rgba(0, 229, 255, 0.08);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      transition: height 0.2s;
    }
    .video-progress-container:hover {
      height: 6px;
    }
    .video-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan) 0%, var(--azure) 60%, var(--teal) 100%);
      border-radius: 2px;
      width: 0%;
      position: relative;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
      transition: box-shadow 0.3s;
    }
    .video-progress-handle {
      position: absolute;
      right: -5px; top: -5px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan), 0 0 4px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .video-progress-container:hover .video-progress-handle {
      opacity: 1;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ctrl-group-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .v-btn {
      background: rgba(0, 229, 255, 0.04);
      border: 1px solid rgba(0, 229, 255, 0.12);
      color: var(--text-2);
      padding: 7px 16px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-ui);
      transition: all 0.2s ease;
      letter-spacing: 0.04em;
    }
    .v-btn:hover {
      background: rgba(0, 229, 255, 0.1);
      border-color: rgba(0, 229, 255, 0.25);
      color: var(--text-1);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.08);
    }
    .v-btn.btn-play {
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--cyan);
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.12);
    }
    .v-btn.btn-play:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 4px 24px rgba(0, 229, 255, 0.2);
      transform: translateY(-1px);
    }
    .v-btn.btn-record {
      background: rgba(255, 90, 95, 0.06);
      border: 1px solid rgba(255, 90, 95, 0.2);
      color: var(--red);
    }
    .v-btn.recording {
      background: rgba(255, 90, 95, 0.2);
      border-color: rgba(255, 90, 95, 0.5);
      color: #fff;
      animation: recordPulse 1.6s ease-in-out infinite;
    }
    @keyframes recordPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 90, 95, 0.3); }
      50% { box-shadow: 0 0 0 6px rgba(255, 90, 95, 0); }
    }

    .scene-jump-pills {
      display: flex;
      gap: 3px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid rgba(0, 229, 255, 0.06);
    }
    .scene-pill {
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 9px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-family: var(--font-mono);
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    .scene-pill:hover { color: var(--text-2); }
    .scene-pill.active {
      background: rgba(0, 229, 255, 0.1);
      color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.1);
    }

    .back-nav {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 12px;
    }
    .back-nav a {
      color: var(--cyan);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      letter-spacing: 0.04em;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .back-nav a:hover { opacity: 1; text-decoration: none; }
  </style>
</head>
<body>

  <div class="video-theater">
    <div class="video-hud-header">
      <div class="hud-title">
        <div class="hud-title-icon"></div>
        <span>LUCIX AUTONOMOUS INTELLIGENCE</span>
        <div class="hud-badge"><div class="hud-dot"></div> NEURAL NARRATION ACTIVE</div>
      </div>
      <div class="hud-scene-name" id="sceneNameDisplay">ACT 1 : THE GEOLOCATION ILLUSION</div>
      <div class="hud-timecode" id="timecodeDisplay">00:00 / 03:00</div>
    </div>

    <div class="video-viewport" id="viewport">
      <canvas id="videoCanvas" width="1280" height="720"></canvas>

      <div class="subtitles-banner" id="subtitlesBanner">
        <div class="sub-speaker" id="subSpeaker">◈ LUCA · AUTONOMOUS FORENSIC INTELLIGENCE</div>
        <div class="sub-text" id="subText">Initializing autonomous cyber threat briefing…</div>
      </div>
    </div>

    <div class="video-controls-bar">
      <div class="video-progress-container" id="progressBarContainer">
        <div class="video-progress-bar" id="progressBar">
          <div class="video-progress-handle"></div>
        </div>
      </div>

      <div class="controls-row">
        <div class="ctrl-group-left">
          <button class="v-btn btn-play" id="playBtn" onclick="togglePlay()">▶ Play Forensic Briefing</button>
          <button class="v-btn" onclick="restartVideo()">⏮ Restart</button>

          <button class="v-btn btn-record" id="recordBtn" onclick="toggleRecording()">● Record & Save</button>
        </div>

        <div class="scene-jump-pills">
          <button class="scene-pill active" onclick="jumpToTime(0)">01 Illusion</button>

          <button class="scene-pill" onclick="jumpToTime(90)">04 Simulator</button>
          <button class="scene-pill" onclick="jumpToTime(125)">05 Graph</button>
          <button class="scene-pill" onclick="jumpToTime(155)">06 Intelligence</button>
        </div>
      </div>
    </div>
  </div>

  <div class="back-nav">
    <a href="index.html">← Return to LUCIX Dashboard</a>
    <span style="color:var(--text-3)">·</span>
    <span style="color:var(--text-3); font-weight:400; letter-spacing:0.06em; font-size:11px">Narrated by <strong style="color:var(--cyan)">LUCA</strong> · Logical Unified Cyber Attribution</span>
  </div>

  <script>
    'use strict';

    // ═══════════════════════════════════════════════════════════════
    // COLOR SYSTEM — Premium LUCIX Design Language
    // ═══════════════════════════════════════════════════════════════
    const C = {
      void:     '#050608',
      deep:     '#081321',
      cyan:     '#00E5FF',
      azure:    '#3A86FF',
      teal:     '#00FFC6',
      red:      '#FF5A5F',
      success:  '#DDFBFF',
      white:    '#E8F4F8',
      muted:    '#8BA4B8',
      dim:      '#4A6478',
      dark:     '#1A2A3A',

      cyanA:    (a) => `rgba(0, 229, 255, ${a})`,
      azureA:   (a) => `rgba(58, 134, 255, ${a})`,
      tealA:    (a) => `rgba(0, 255, 198, ${a})`,
      redA:     (a) => `rgba(255, 90, 95, ${a})`,
      whiteA:   (a) => `rgba(232, 244, 248, ${a})`,
    };

    // ═══════════════════════════════════════════════════════════════
    // PARTICLE SYSTEM
    // ═══════════════════════════════════════════════════════════════
    const PARTICLES = [];
    const MAX_PARTICLES = 80;
    for (let i = 0; i < MAX_PARTICLES; i++) {
      PARTICLES.push({
        x: Math.random() * 1280,
        y: Math.random() * 720,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.2 - 0.1,
        size: Math.random() * 1.5 + 0.3,
        opacity: Math.random() * 0.3 + 0.05,
        pulse: Math.random() * Math.PI * 2,
      });
    }

    function updateAndDrawParticles(ctx, w, h, time) {
      PARTICLES.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.pulse += 0.02;
        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;

        const a = p.opacity * (0.5 + 0.5 * Math.sin(p.pulse));
        ctx.fillStyle = C.cyanA(a);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // HUD MICRO-DETAIL HELPERS
    // ═══════════════════════════════════════════════════════════════
    function drawCornerBrackets(ctx, x, y, w, h, size, color, lineW) {
      ctx.strokeStyle = color || C.cyanA(0.3);
      ctx.lineWidth = lineW || 1;
      const s = size || 14;
      // Top-left
      ctx.beginPath(); ctx.moveTo(x, y + s); ctx.lineTo(x, y); ctx.lineTo(x + s, y); ctx.stroke();
      // Top-right
      ctx.beginPath(); ctx.moveTo(x + w - s, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + s); ctx.stroke();
      // Bottom-left
      ctx.beginPath(); ctx.moveTo(x, y + h - s); ctx.lineTo(x, y + h); ctx.lineTo(x + s, y + h); ctx.stroke();
      // Bottom-right
      ctx.beginPath(); ctx.moveTo(x + w - s, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - s); ctx.stroke();
    }

    function drawScanLine(ctx, w, h, time) {
      const scanY = (time * 30) % h;
      const grad = ctx.createLinearGradient(0, scanY - 20, 0, scanY + 20);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(0.5, C.cyanA(0.03));
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, scanY - 20, w, 40);
    }

    function drawHexStrings(ctx, w, h, time) {
      ctx.fillStyle = C.cyanA(0.04);
      ctx.font = '300 9px "JetBrains Mono"';
      ctx.textAlign = 'left';
      const hex = '0123456789ABCDEF';
      const seed = Math.floor(time * 2);
      for (let i = 0; i < 4; i++) {
        let str = '';
        for (let j = 0; j < 16; j++) str += hex[(seed + i * 7 + j * 3) % 16];
        ctx.fillText(str, 18, 28 + i * 14);
      }
      ctx.textAlign = 'right';
      for (let i = 0; i < 4; i++) {
        let str = '';
        for (let j = 0; j < 16; j++) str += hex[(seed + i * 11 + j * 5) % 16];
        ctx.fillText(str, w - 18, h - 55 + i * 14);
      }
    }

    function drawCalibrationMarks(ctx, w, h) {
      ctx.strokeStyle = C.cyanA(0.06);
      ctx.lineWidth = 0.5;
      // Center crosshair
      const cx = w / 2, cy = h / 2;
      ctx.beginPath(); ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20); ctx.stroke();
      // Edge tick marks
      for (let i = 0; i < w; i += 80) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i, h); ctx.lineTo(i, h - 4); ctx.stroke();
      }
      for (let i = 0; i < h; i += 80) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(4, i); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w, i); ctx.lineTo(w - 4, i); ctx.stroke();
      }
    }

    function drawTargetingRing(ctx, x, y, radius, time, color) {
      const col = color || C.cyanA(0.2);
      ctx.strokeStyle = col;
      ctx.lineWidth = 1;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(time * 0.5);
      // Outer ring with gaps
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, i * Math.PI/2 + 0.1, i * Math.PI/2 + 1.2);
        ctx.stroke();
      }
      ctx.rotate(-time * 0.8);
      ctx.strokeStyle = color ? color.replace(/[\d.]+\)$/, '0.12)') : C.cyanA(0.1);
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.3, i * Math.PI/3 + 0.05, i * Math.PI/3 + 0.6);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ═══════════════════════════════════════════════════════════════
    // GLASSMORPHIC PANEL DRAWING
    // ═══════════════════════════════════════════════════════════════
    function glassPanel(ctx, x, y, w, h, opts = {}) {
      const r = opts.radius || 18;
      const fill = opts.fill || C.whiteA(0.03);
      const stroke = opts.stroke || C.cyanA(0.12);
      const glowColor = opts.glow || null;

      ctx.save();
      if (glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 20;
      }
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = opts.lineWidth || 1;
      roundRect(ctx, x, y, w, h, r, true, true);
      ctx.restore();

      if (opts.brackets !== false) {
        drawCornerBrackets(ctx, x, y, w, h, opts.bracketSize || 12, opts.bracketColor || C.cyanA(0.2));
      }
    }

    function drawSceneLabel(ctx, w, label, subtitle, y1, y2) {
      ctx.textAlign = 'center';
      ctx.fillStyle = C.cyan;
      ctx.font = '500 11px "JetBrains Mono"';
      ctx.letterSpacing = '0.16em';
      ctx.fillText(label.toUpperCase(), w/2, y1 || 60);

      ctx.fillStyle = C.white;
      ctx.font = '700 30px "Inter"';
      ctx.fillText(subtitle, w/2, y2 || 98);
    }

    // ═══════════════════════════════════════════════════════════════
    // TIMING / STATE
    // ═══════════════════════════════════════════════════════════════
    const TOTAL_DURATION = 180;
    let currentTime = 0;
    let isPlaying = false;
    let isMuted = false;
    let animFrameId = null;
    let lastTimestamp = 0;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let audioContext = null;

    // FORENSIC VOICE SCRIPT
    const SCRIPT = [
      // ACT 1: THE GEOLOCATION ILLUSION (0 - 25s)
      {
        start: 0, end: 12,
        scene: 'ACT 1 : THE GEOLOCATION ILLUSION',
        speaker: '◈ LUCA · AUTONOMOUS FORENSIC INTELLIGENCE',
        text: "Every day in security operations centers worldwide, analysts make a catastrophic mistake. They look at an IP address on a world map and assume they are looking at the attacker's physical location."
      },
      {
        start: 12, end: 25,
        scene: 'ACT 1 : THE GEOLOCATION ILLUSION',
        speaker: '◈ LUCA · AUTONOMOUS FORENSIC INTELLIGENCE',
        text: "They are not. They are looking at a decoy. Between bulletproof cloud servers, VPN tunnels, and Tor exit relays, traditional geolocation is a dangerous illusion. Welcome to LUCIX."
      },

      // ACT 2: THE 5-LAYER FORENSIC PIPELINE (25 - 55s)
      {
        start: 25, end: 40,
        scene: 'ACT 2 : THE FORENSIC PIPELINE',
        speaker: '◈ LUCA · AUTONOMOUS FORENSIC INTELLIGENCE',
        text: "I am LUCA, the intelligence core inside LUCIX. To eliminate guesswork, our system deploys a rigorous five-layer forensic pipeline. First, mathematical SHA-256 cryptographic hash chaining locks every packet into an immutable digital audit trail."
      },
      {
        start: 40, end: 55,
        scene: 'ACT 2 : THE FORENSIC PIPELINE',
        speaker: '◈ LUCA · AUTONOMOUS FORENSIC INTELLIGENCE',
        text: "Next, our autonomous classifier interrogates ASNs and reverse DNS, while our geometric consensus engine correlates multiple independent GeoIP databases. We enforce a hard law: Infrastructure location is never physical operator location."
      },

      // ACT 3: GEOINT & THE 9,360 KM TOR JUMP (55 - 90s)
      {
        start: 55, end: 72,

    function playBeep(freq = 800, dur = 0.1) {
      if (isMuted) return;
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + dur);
      } catch (_) {}
    }

    let currentSpeechSegment = null;
    function triggerVoiceForTime(sec) {
      if (isMuted || !window.speechSynthesis) return;
      const seg = SCRIPT.find(s => sec >= s.start && sec < s.end);
      if (seg && seg !== currentSpeechSegment) {
        currentSpeechSegment = seg;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(seg.text);
        utter.rate = 1.08;
        utter.pitch = 1.05;
        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v =>

          v.name.includes('Microsoft Aria') || v.name.includes('Zira') ||
          v.name.includes('Natural')
        ) || voices[0];
        if (preferredVoice) utter.voice = preferredVoice;
        window.speechSynthesis.speak(utter);
      }
    }

    function roundRect(c, x, y, width, height, radius, fill, stroke) {
      c.beginPath();
      c.moveTo(x + radius, y);
      c.lineTo(x + width - radius, y);
      c.quadraticCurveTo(x + width, y, x + width, y + radius);
      c.lineTo(x + width, y + height - radius);
      c.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      c.lineTo(x + radius, y + height);
      c.quadraticCurveTo(x, y + height, x, y + height - radius);
      c.lineTo(x, y + radius);
      c.quadraticCurveTo(x, y, x + radius, y);
      c.closePath();
      if (fill) c.fill();
      if (stroke) c.stroke();
    }

    function drawFlowBox(c, x, y, bw, bh, title, val, col) {
      glassPanel(c, x, y, bw, bh, {
        radius: 12,
        fill: C.whiteA(0.03),

        brackets: true,
        bracketColor: col + '25',
        bracketSize: 8

      c.textAlign = 'center';
      c.fillStyle = C.muted;
      c.font = '500 9px "JetBrains Mono"';
      c.fillText(title, x + bw/2, y + 30);
      c.fillStyle = col;
      c.font = '600 12px "JetBrains Mono"';
      c.fillText(val, x + bw/2, y + 55);
    }

    function drawFlowArrow(c, x1, y1, x2, y2, label, col) {
      c.strokeStyle = col + '40';
      c.lineWidth = 1;
      c.setLineDash([4, 4]);
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
      c.setLineDash([]);
      // Arrow head
      c.fillStyle = col + '60';
      c.beginPath();
      c.moveTo(x2 - 6, y1 - 4); c.lineTo(x2, y1); c.lineTo(x2 - 6, y1 + 4);
      c.fill();
      c.textAlign = 'center';
      c.fillStyle = col;
      c.font = '500 8px "JetBrains Mono"';
      c.fillText(label, (x1+x2)/2, y1 - 12);
    }

    function drawPremiumNode(c, x, y, label, sub, col, time) {
      // Node glow
      c.save();
      c.shadowColor = col;
      c.shadowBlur = 10;
      c.fillStyle = C.deep;
      c.strokeStyle = col + '50';
      c.lineWidth = 1;
      roundRect(c, x - 65, y - 22, 130, 44, 10, true, true);
      c.restore();

      c.textAlign = 'center';
      c.fillStyle = C.white;
      c.font = '600 9px "JetBrains Mono"';
      c.fillText(label, x, y - 3);
      c.fillStyle = C.muted;
      c.font = '400 8px "Inter"';
      c.fillText(sub, x, y + 12);
    }

    function drawPremiumEdge(c, x1, y1, x2, y2, col, label, time) {
      c.strokeStyle = col + '35';
      c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();

      // Animated energy pulse along edge
      const pulseT = (time * 0.8) % 1;
      const px = x1 + (x2 - x1) * pulseT;
      const py = y1 + (y2 - y1) * pulseT;
      c.fillStyle = col;
      c.shadowColor = col;
      c.shadowBlur = 8;
      c.beginPath(); c.arc(px, py, 2.5, 0, Math.PI * 2); c.fill();
      c.shadowBlur = 0;

      // Arrow head
      const angle = Math.atan2(y2 - y1, x2 - x1);
      c.save();
      c.translate(x2, y2);
      c.rotate(angle);
      c.fillStyle = col + '60';
      c.beginPath();
      c.moveTo(0, 0); c.lineTo(-8, -4); c.lineTo(-8, 4);
      c.closePath(); c.fill();
      c.restore();

      c.textAlign = 'center';
      c.fillStyle = col;
      c.font = '500 8px "JetBrains Mono"';
      c.fillText(label, (x1+x2)/2, (y1+y2)/2 - 10);
    }

    // ═══════════════════════════════════════════════════════════════
    function updateSubtitlesAndHUD(time) {
      const m = Math.floor(time / 60);
      const s = Math.floor(time % 60);
      document.getElementById('timecodeDisplay').textContent =
        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')} / 03:00`;

      const pct = (time / TOTAL_DURATION) * 100;
      document.getElementById('progressBar').style.width = `${pct}%`;

      const seg = SCRIPT.find(sc => time >= sc.start && time < sc.end) || SCRIPT[SCRIPT.length - 1];
      if (seg) {
        document.getElementById('sceneNameDisplay').textContent = seg.scene;
        document.getElementById('subSpeaker').textContent = seg.speaker;
        document.getElementById('subText').textContent = seg.text;
      }

      const pills = document.querySelectorAll('.scene-pill');
      const sceneBreaks = [0, 25, 55, 90, 125, 155];
      let curSceneIdx = 0;
      for (let i = sceneBreaks.length - 1; i >= 0; i--) {
        if (time >= sceneBreaks[i]) { curSceneIdx = i; break; }
      }
      pills.forEach((p, idx) => p.classList.toggle('active', idx === curSceneIdx));

      triggerVoiceForTime(time);
    }

    function loop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          pauseVideo();
        }
      }

      renderFrame(currentTime);

      if (isPlaying || currentTime < TOTAL_DURATION) {
        animFrameId = requestAnimationFrame(loop);
      }
    }

    function togglePlay() {
      if (isPlaying) { pauseVideo(); } else { playVideo(); }
    }

    function playVideo() {
      if (currentTime >= TOTAL_DURATION) currentTime = 0;
      isPlaying = true;
      lastTimestamp = 0;
      document.getElementById('playBtn').textContent = '⏸ Pause Briefing';
      cancelAnimationFrame(animFrameId);
      animFrameId = requestAnimationFrame(loop);
      playBeep(600, 0.08);
    }

    function pauseVideo() {
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ Play Forensic Briefing';
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      currentSpeechSegment = null;
    }

    function restartVideo() {
      pauseVideo();
      currentTime = 0;
      currentSpeechSegment = null;
      renderFrame(0);
      playVideo();
    }

    function jumpToTime(sec) {
      currentTime = sec;
      currentSpeechSegment = null;
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      renderFrame(sec);
      if (!isPlaying) playVideo();
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('muteBtn').textContent = isMuted ? '◎ Voice: OFF' : '◉ Voice: ON';
      if (isMuted && window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function toggleRecording() {
      if (isRecording) { stopRecording(); } else { startRecording(); }
    }

    function startRecording() {
      try {
        const stream = canvas.captureStream(30);
        recordedChunks = [];
        const mimeTypes = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'];
        let selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';
        mediaRecorder = new MediaRecorder(stream, selectedMime ? { mimeType: selectedMime } : {});
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: selectedMime || 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `LUCIX_Forensic_Briefing.${selectedMime.includes('mp4') ? 'mp4' : 'webm'}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };
        mediaRecorder.start();
        isRecording = true;
        const recBtn = document.getElementById('recordBtn');
        recBtn.textContent = '⏹ Stop & Save';
        recBtn.classList.add('recording');
        restartVideo();
      } catch (err) {
        alert('Recording error: ' + err.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        const recBtn = document.getElementById('recordBtn');
        recBtn.textContent = '● Record & Save';
        recBtn.classList.remove('recording');
      }
    }

    document.getElementById('progressBarContainer').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickRatio = (e.clientX - rect.left) / rect.width;
      jumpToTime(clickRatio * TOTAL_DURATION);
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderFrame(0);
    });
  </script>
</body>
</html>
